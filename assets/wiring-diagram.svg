<svg viewBox="0 0 1000 960" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#333333; stroke-width:2; }
    .core { fill:#eef4ff; stroke:#2b5fad; stroke-width:2.5; }
    .relay { fill:#fff1ee; stroke:#c0392b; stroke-width:2; }
    .sensor { fill:#eefaf0; stroke:#1e8449; stroke-width:2; }
    .io { fill:#fff8e6; stroke:#b8860b; stroke-width:2; }
    .unused { fill:#f2f2f2; stroke:#999999; stroke-width:1.5; stroke-dasharray:4,3; }
    .title { font-size:16px; font-weight:700; fill:#111111; }
    .label { font-size:13px; fill:#111111; }
    .pin { font-size:12px; fill:#2b5fad; font-weight:600; }
    .note { font-size:11px; fill:#555555; font-style:italic; }
    .wire { stroke:#444444; stroke-width:1.6; fill:none; }
    .wire-rs485 { stroke:#1e8449; stroke-width:2.2; fill:none; }
    .wire-i2c { stroke:#b8860b; stroke-width:2; fill:none; }
    .wire-unused { stroke:#999999; stroke-width:1.3; fill:none; stroke-dasharray:4,3; }
  </style>

  <!-- Title / legend line (kept clear of the diagram body below) -->
  <text x="500" y="26" text-anchor="middle" class="title" font-size="20">Lab16 Smart Water Quality — Wiring Diagram (ESP32 Devkit V2)</text>
  <text x="500" y="46" text-anchor="middle" class="note">อ้างอิงจาก pins_config.h</text>
  <text x="500" y="62" text-anchor="middle" class="note">เส้นสีเขียว = RS-485 (Modbus RTU, 4800 baud) · เส้นสีน้ำตาล = I2C · เส้นประสีเทา = ประกาศไว้แต่ไม่ได้ใช้ใน Lab16</text>

  <!-- ============ diagram body, shifted below the header ============ -->
  <g transform="translate(0,40)">

  <!-- ============ ESP32 core ============ -->
  <rect x="380" y="330" width="240" height="260" rx="10" class="core"/>
  <text x="500" y="358" text-anchor="middle" class="title">ESP32 Devkit V2</text>
  <text x="500" y="376" text-anchor="middle" class="label">(38 pin)</text>

  <!-- pin labels inside ESP32 box -->
  <text x="392" y="405" class="pin">GPIO1 (TX0)</text>
  <text x="392" y="422" class="pin">GPIO3 (RX0)</text>
  <text x="392" y="448" class="pin">GPIO17</text>
  <text x="392" y="468" class="pin">GPIO16</text>
  <text x="392" y="488" class="pin">GPIO4</text>

  <text x="608" y="405" text-anchor="end" class="pin">GPIO21 (SDA)</text>
  <text x="608" y="422" text-anchor="end" class="pin">GPIO22 (SCL)</text>
  <text x="608" y="448" text-anchor="end" class="pin">GPIO15</text>
  <text x="608" y="468" text-anchor="end" class="pin">GPIO2</text>

  <text x="410" y="560" class="pin">GPIO34</text>
  <text x="475" y="560" class="pin">GPIO35</text>
  <text x="540" y="560" class="pin">GPIO32</text>

  <text x="392" y="520" class="pin" fill="#888888">GPIO33 (ISO1)</text>
  <text x="392" y="536" class="pin" fill="#888888">GPIO27 (ISO2)</text>
  <text x="608" y="500" text-anchor="end" class="pin" fill="#888888">GPIO14 (LDR)</text>

  <!-- ============ RS485 transceiver ============ -->
  <rect x="60" y="380" width="150" height="70" rx="8" class="io"/>
  <text x="135" y="405" text-anchor="middle" class="label" font-weight="700">RS-485</text>
  <text x="135" y="422" text-anchor="middle" class="label">Transceiver</text>
  <text x="135" y="438" text-anchor="middle" class="note">MAX13487 · A+/B-</text>

  <path class="wire" d="M380,400 H210"/>
  <text x="290" y="393" text-anchor="middle" class="note">TX0/RX0 (ใช้ร่วมกับ USB)</text>

  <!-- 3 modbus sensors daisy chained off RS485 -->
  <rect x="20" y="50" width="190" height="60" rx="8" class="sensor"/>
  <text x="115" y="72" text-anchor="middle" class="label" font-weight="700">Water Quality</text>
  <text x="115" y="88" text-anchor="middle" class="label">Slave ID 3 (ตัวหลัก)</text>
  <text x="115" y="103" text-anchor="middle" class="note">pH · EC · WaterTemp · TDS · Salinity</text>

  <rect x="20" y="130" width="190" height="55" rx="8" class="sensor"/>
  <text x="115" y="152" text-anchor="middle" class="label" font-weight="700">RS-SD-N01-TR</text>
  <text x="115" y="168" text-anchor="middle" class="label">Slave ID 1 — ความชื้นดิน</text>

  <rect x="20" y="205" width="190" height="55" rx="8" class="sensor"/>
  <text x="115" y="227" text-anchor="middle" class="label" font-weight="700">PR-300AL-RA-N01</text>
  <text x="115" y="243" text-anchor="middle" class="label">Slave ID 2 — ความเข้มแสง</text>

  <path class="wire-rs485" d="M125,380 V260"/>
  <path class="wire-rs485" d="M125,185 V110"/>
  <path class="wire-rs485" d="M105,380 V110"/>
  <text x="150" y="310" class="note" fill="#1e8449">A+ / B- daisy-chain</text>
  <text x="150" y="325" class="note" fill="#1e8449">(ID ไม่ซ้ำ, baud ตรงกัน)</text>

  <!-- ============ Relays ============ -->
  <rect x="700" y="330" width="220" height="55" rx="8" class="relay"/>
  <text x="810" y="352" text-anchor="middle" class="label" font-weight="700">Relay 1 — pH Doser</text>
  <text x="810" y="368" text-anchor="middle" class="note">ปั๊มจ่ายสารปรับ pH · Active LOW</text>

  <rect x="700" y="400" width="220" height="55" rx="8" class="relay"/>
  <text x="810" y="422" text-anchor="middle" class="label" font-weight="700">Relay 2 — Nutrient Doser</text>
  <text x="810" y="438" text-anchor="middle" class="note">ปั๊มจ่ายปุ๋ย (ปรับ EC) · Active LOW</text>

  <rect x="700" y="470" width="220" height="55" rx="8" class="relay"/>
  <text x="810" y="492" text-anchor="middle" class="label" font-weight="700">Relay 3 — Aerator</text>
  <text x="810" y="508" text-anchor="middle" class="note">ปั๊มเติมอากาศ/เวียนน้ำ · Active LOW</text>

  <path class="wire" d="M620,404 H700"/>
  <text x="655" y="397" text-anchor="middle" class="pin" font-size="11">GPIO17</text>

  <path class="wire" d="M620,424 H660 V427 H700"/>
  <text x="655" y="447" text-anchor="middle" class="pin" font-size="11">GPIO16</text>

  <path class="wire" d="M620,444 H680 V497 H700"/>
  <text x="655" y="465" text-anchor="middle" class="pin" font-size="11">GPIO4</text>

  <!-- ============ OLED ============ -->
  <rect x="700" y="150" width="220" height="60" rx="8" class="io"/>
  <text x="810" y="173" text-anchor="middle" class="label" font-weight="700">OLED SSD1306</text>
  <text x="810" y="190" text-anchor="middle" class="note">I2C 0x3C · 128×64</text>

  <path class="wire-i2c" d="M620,404 H650 V180 H700"/>
  <text x="640" y="290" class="pin" fill="#b8860b" font-size="11">GPIO21 SDA</text>
  <path class="wire-i2c" d="M620,422 H670 V195 H700"/>
  <text x="640" y="270" class="pin" fill="#b8860b" font-size="11">GPIO22 SCL</text>

  <!-- ============ DHT11 ============ -->
  <rect x="700" y="230" width="220" height="55" rx="8" class="sensor"/>
  <text x="810" y="252" text-anchor="middle" class="label" font-weight="700">DHT11</text>
  <text x="810" y="268" text-anchor="middle" class="note">อุณหภูมิ/ความชื้นอากาศ (ตัวประกอบ)</text>

  <path class="wire" d="M620,448 H690 V257 H700"/>
  <text x="640" y="345" class="pin" font-size="11">GPIO15</text>

  <!-- ============ LED ============ -->
  <rect x="700" y="60" width="220" height="55" rx="8" class="box"/>
  <text x="810" y="82" text-anchor="middle" class="label" font-weight="700">Onboard LED</text>
  <text x="810" y="98" text-anchor="middle" class="note">เตือน AP/OLED มีปัญหา</text>

  <path class="wire" d="M620,468 H720 V87 H700"/>
  <text x="640" y="200" class="pin" font-size="11">GPIO2</text>

  <!-- ============ Buttons ============ -->
  <rect x="330" y="640" width="90" height="55" rx="8" class="io"/>
  <text x="375" y="662" text-anchor="middle" class="label" font-weight="700">SW1</text>
  <text x="375" y="678" text-anchor="middle" class="note">หน้าก่อน</text>

  <rect x="455" y="640" width="90" height="55" rx="8" class="io"/>
  <text x="500" y="662" text-anchor="middle" class="label" font-weight="700">SW2</text>
  <text x="500" y="678" text-anchor="middle" class="note">หน้าถัดไป</text>

  <rect x="580" y="640" width="90" height="55" rx="8" class="io"/>
  <text x="625" y="662" text-anchor="middle" class="label" font-weight="700">SW3</text>
  <text x="625" y="678" text-anchor="middle" class="note">ล็อกหน้าจอ</text>

  <path class="wire" d="M410,590 V640"/>
  <text x="395" y="620" text-anchor="middle" class="pin" font-size="11">34</text>
  <path class="wire" d="M500,590 V640"/>
  <text x="485" y="620" text-anchor="middle" class="pin" font-size="11">35</text>
  <path class="wire" d="M590,590 V640"/>
  <text x="575" y="620" text-anchor="middle" class="pin" font-size="11">32</text>

  <text x="500" y="720" text-anchor="middle" class="note">R pull-up 10k ภายนอกให้ทั้ง 3 ปุ่ม · ปุ่มใช้เลื่อนหน้าจอเท่านั้น สั่งปั๊มไม่ได้</text>

  <!-- ============ Unused pins ============ -->
  <rect x="60" y="470" width="150" height="55" rx="8" class="unused"/>
  <text x="135" y="492" text-anchor="middle" class="label">ISO1 / ISO2</text>
  <text x="135" y="508" text-anchor="middle" class="note">Opto-isolated input (ไม่ใช้ใน Lab16)</text>

  <path class="wire-unused" d="M380,520 H210"/>
  <path class="wire-unused" d="M380,536 H210 V497"/>

  <rect x="60" y="540" width="150" height="45" rx="8" class="unused"/>
  <text x="135" y="562" text-anchor="middle" class="label">LDR</text>
  <text x="135" y="576" text-anchor="middle" class="note">Digital only (ไม่ใช้ใน Lab16)</text>

  <path class="wire-unused" d="M608,500 H620 V562 H210"/>

  <!-- Legend -->
  <rect x="40" y="800" width="18" height="14" class="relay"/>
  <text x="65" y="812" class="label">รีเลย์ (ปั๊ม)</text>
  <rect x="180" y="800" width="18" height="14" class="sensor"/>
  <text x="205" y="812" class="label">เซนเซอร์</text>
  <rect x="300" y="800" width="18" height="14" class="io"/>
  <text x="325" y="812" class="label">I/O อื่น ๆ</text>
  <rect x="420" y="800" width="18" height="14" class="unused"/>
  <text x="445" y="812" class="label">ไม่ได้ใช้ใน Lab16</text>

  </g>
</svg>
